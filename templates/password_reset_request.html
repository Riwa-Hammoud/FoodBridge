<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Bridge</title>
</head>

<body>
    <h2>Forgot Password</h2>
    {% if validlink %}
    <form method="post">
        {% csrf_token %}
        {{ form.email.label_tag }}
        {{ form.email }}
        {{ form.email.errors }}
        <button type="submit">Reset Password</button>
    </form>
    {% else %}
    <p>This reset link is invalid or has expired. <a href="{% url 'password_reset' %}">Request a new one</a>.</p>
    {% endif %}
</body>

</html>
